name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Website tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Server tests
        run: npm run test:server

      - name: Build website
        run: npm run build
        env:
          CI: true
